# What `make pep8` (pycodestyle) leaves out, as the user decided. .claude/STYLE.md has the
# reasons: lines run as long as they need to read as one thought, and the blank-line counts around
# definitions and at the end of a file aren't rules here. Nothing pycodestyle reports is a rule
# unless STYLE.md says so. Setting ignore replaces pycodestyle's own default list, so that list
# (E121, E123, E126, E226, E24, E704, W503, W504) is repeated here.
[pycodestyle]
ignore = E501,E302,E305,W391,E121,E123,E126,E226,E24,E704,W503,W504
statistics = True
