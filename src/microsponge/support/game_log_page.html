<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>microsponge</title>
<style>
:root { --surface: #fcfcfb; --panel: #ffffff; --text: #0b0b0b; --muted: #52514e; --rule: #e4e3df; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; }
@media (prefers-color-scheme: dark) {
  :root { --surface: #1a1a19; --panel: #232322; --text: #f0efec; --muted: #c3c2b7; --rule: #383835; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767; }
}
body { margin: 0; padding: 24px 16px 64px; background: var(--surface); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
main { max-width: 1280px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 8px; text-wrap: balance; }
#winner { margin: 0 0 16px; color: var(--muted); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 20px; padding: 0 0 8px; border-bottom: 1px solid var(--rule); }
.tabs button { font: inherit; font-size: 14px; color: var(--muted); background: none; border: 1px solid transparent; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.tabs button:hover { color: var(--text); background: var(--panel); border-color: var(--rule); }
.tabs button[aria-selected="true"] { color: var(--text); background: var(--panel); border-color: var(--rule); font-weight: 600; }
.tabs button:focus-visible { outline: 2px solid var(--s1); outline-offset: 1px; }
.note { color: var(--muted); }
h3 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
.wide, .cell, .timeline { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; }
.wide { margin-bottom: 16px; }
.wide .plot { height: 340px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(380px, 100%), 1fr)); gap: 16px; }
.cell .plot { height: 220px; }
.plot { position: relative; }
.timelines { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 16px; }
.timeline h3 { display: flex; align-items: center; gap: 8px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.timeline ol { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; color: var(--muted); font-size: 13px; }
.timeline li { padding: 3px 0; border-top: 1px solid var(--rule); }
.scroll { overflow-x: auto; margin-bottom: 24px; }
table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
caption { text-align: left; font-weight: 600; padding-bottom: 6px; white-space: nowrap; }
th, td { padding: 4px 12px 4px 0; text-align: right; border-top: 1px solid var(--rule); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; }
th:first-child, td:first-child, td.words, th.words { text-align: left; }
#warning { color: var(--muted); }
</style>
</head>
<body data-palette="#2a78d6,#eb6834,#1baf7a,#eda100,#e87ba4,#008300,#6250d6,#e34948">
<main>
<h1 id="title"></h1>
<p id="winner"></p>
<p id="warning" hidden></p>
<nav class="tabs" role="tablist" id="tabs"></nav>
<div id="panels"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const PAGE = /*PAGE*/;
const style = getComputedStyle(document.documentElement);
const token = (name) => style.getPropertyValue(name).trim();
// A civilization keeps its color in every chart: the color follows the civilization, never the order of the lines.
const colorOf = (place) => token('--s' + (place % 8 + 1));
const element = (tag, text, parent, className) => {
  const made = document.createElement(tag);
  if (text !== null) made.textContent = text;
  if (className) made.className = className;
  parent.appendChild(made);
  return made;
};

document.title = PAGE.title;
document.getElementById('title').textContent = PAGE.title;
document.getElementById('winner').textContent = PAGE.winner;

function draw(chart, parent) {
  const box = element('div', null, parent, chart.wide ? 'wide' : 'cell');
  element('h3', chart.title, box);
  const plot = element('div', null, box, 'plot');
  const canvas = element('canvas', null, plot);
  const longest = Math.max(...chart.series.map((series) => series.values.length));
  // A chart of bars has a label for each bar, like a span of turns; a chart of lines has a turn for each point.
  const labels = chart.labels || Array.from({length: longest}, (_, turn) => turn);
  new Chart(canvas, {
    type: chart.bars ? 'bar' : 'line',
    data: {
      labels,
      datasets: chart.series.map((series, place) => ({
        label: series.name, data: series.values, borderColor: colorOf(place), backgroundColor: colorOf(place),
        borderWidth: chart.bars ? 0 : 2, borderRadius: 4, pointRadius: 0, pointHoverRadius: 4, tension: 0, stepped: chart.stepped,
      })),
    },
    options: {
      maintainAspectRatio: false, animation: false,
      interaction: {mode: 'index', intersect: false},
      plugins: {
        legend: {position: 'bottom', labels: {color: token('--muted'), boxWidth: 12, boxHeight: 12, usePointStyle: false}},
        tooltip: {callbacks: {title: (items) => chart.labels ? items[0].label : PAGE.turnLabel.replace('{turn}', items[0].label)}},
      },
      scales: {
        x: {ticks: {color: token('--muted'), maxTicksLimit: 9}, grid: {display: false}, border: {color: token('--rule')}},
        y: {beginAtZero: true, ticks: {color: token('--muted'), maxTicksLimit: 6, precision: chart.bars ? 0 : undefined}, grid: {color: token('--rule')}, border: {display: false}},
      },
    },
  });
}

// The charts of a tab: the wide ones first, each across the page, and then the rest in a grid.
function drawCharts(tab, panel) {
  if (tab.note) element('p', tab.note, panel, 'note');
  drawTableList(tab.tables, panel);
  if (!window.Chart) return;
  const wide = element('div', null, panel);
  const grid = element('div', null, panel, 'grid');
  tab.charts.forEach((chart) => draw(chart, chart.wide ? wide : grid));
}

function drawTimelines(tab, panel) {
  const list = element('div', null, panel, 'timelines');
  PAGE.timelines.forEach((timeline, place) => {
    const box = element('div', null, list, 'timeline');
    const heading = element('h3', null, box);
    element('span', null, heading, 'swatch').style.background = colorOf(place);
    element('span', timeline.title, heading);
    const lines = element('ol', null, box);
    timeline.lines.forEach((line) => element('li', line.trim(), lines));
  });
}

const isNumber = (cell) => /^-?[0-9.]+$/.test(cell);
function drawTables(tab, panel) {
  drawTableList(PAGE.tables, panel);
}

function drawTableList(list, panel) {
  list.forEach((table) => {
    const made = element('table', null, element('div', null, panel, 'scroll'));
    element('caption', table.title, made);
    const head = element('tr', null, element('thead', null, made));
    const words = table.heading.map((_, column) => table.rows.some((row) => row[column] !== '-' && !isNumber(row[column])));
    table.heading.forEach((cell, column) => element('th', cell, head, words[column] ? 'words' : ''));
    const body = element('tbody', null, made);
    table.rows.forEach((row) => {
      const line = element('tr', null, body);
      row.forEach((cell, column) => element('td', cell, line, words[column] ? 'words' : ''));
    });
  });
}

const DRAWERS = {charts: drawCharts, timelines: drawTimelines, tables: drawTables};

if (!window.Chart) {
  const warning = document.getElementById('warning');
  warning.textContent = PAGE.noCharts;
  warning.hidden = false;
}

// Each tab is drawn the first time it is shown, so that a chart is drawn at the size of a visible tab. The tab shown is kept in the address, so that a reload keeps it.
const tabs = PAGE.tabs.map((tab) => {
  const button = element('button', tab.name, document.getElementById('tabs'));
  button.type = 'button';
  button.setAttribute('role', 'tab');
  const panel = element('section', null, document.getElementById('panels'));
  panel.setAttribute('role', 'tabpanel');
  panel.hidden = true;
  button.addEventListener('click', () => { location.hash = tab.id; });
  return {tab, button, panel, drawn: false};
});

function show() {
  const wanted = location.hash.slice(1);
  const shown = tabs.find((entry) => entry.tab.id === wanted) || tabs[0];
  tabs.forEach((entry) => {
    const selected = entry === shown;
    entry.button.setAttribute('aria-selected', selected ? 'true' : 'false');
    entry.panel.hidden = !selected;
  });
  if (!shown.drawn) {
    shown.drawn = true;
    DRAWERS[shown.tab.content](shown.tab, shown.panel);
  }
}

window.addEventListener('hashchange', show);
show();
</script>
</body>
</html>
